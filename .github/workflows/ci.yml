name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run FanScopeKit tests
        working-directory: Packages/FanScopeKit
        run: swift test

      - name: Build FanScope iOS app
        run: |
          xcodebuild build \
            -project FanScope.xcodeproj \
            -scheme FanScope \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
